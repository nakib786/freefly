<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060809" />
    <title>Free Fly Driving School: Learn to drive in a Tesla | Lower Mainland, BC</title>
    <meta
      name="description"
      content="Class 5 and Class 7 driving lessons in a Tesla Model 3. Free Fly Driving School serves Burnaby, Vancouver and Coquitlam in the Lower Mainland, BC."
    />
    <link rel="canonical" href="https://freeflydriving.ca/" />
    <!--
      `max-image-preview:large` is what lets Google use the hero render as the
      thumbnail in a rich result instead of a 100px square, and it is opt-in.
      The markdown alternate is the same page for anything that asks for
      text/markdown; functions/_middleware.ts serves it on content negotiation
      too, for agents that ask by Accept header rather than by URL.
    -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="alternate" type="text/markdown" href="https://freeflydriving.ca/index.md" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Free Fly Driving School" />
    <meta property="og:title" content="Learn to drive in a Tesla | Free Fly Driving School" />
    <meta
      property="og:description"
      content="Class 5 and Class 7 driving lessons in a Tesla Model 3, across Burnaby, Vancouver and Coquitlam. Lesson packages and road-test prep with the car provided."
    />
    <meta property="og:url" content="https://freeflydriving.ca/" />
    <meta property="og:image" content="https://freeflydriving.ca/models/tesla-static-hero.webp" />
    <meta property="og:locale" content="en_CA" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Every value below is verified: address, hours and aggregateRating come
      from the business's own Google Business Profile (read 2026-08-11), prices
      from the live Wix Pricing Plans. Nothing is estimated to make a rich
      result look better; an invented rating is precisely what earns a manual
      action, and aggregateRating in particular is one Google spot-checks.

      ⚠ scripts/build-seo.mjs REPLACES this whole block in dist/index.html with
      a fuller @graph (WebSite + DrivingSchool + FAQPage, prices read live from
      Wix at build time). What is written here is the floor, not the ceiling: it
      is what ships if the generator is skipped, so it must stay valid on its
      own. Keep it accurate; do not try to keep it in sync with the generated
      version by hand.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "DrivingSchool",
        "name": "Free Fly Driving School Limited",
        "url": "https://freeflydriving.ca/",
        "telephone": "+1-250-572-1808",
        "email": "freeflydriving@gmail.com",
        "image": "https://freeflydriving.ca/models/tesla-static-hero.webp",
        "priceRange": "$90-$1600",
        "currenciesAccepted": "CAD",
        "foundingDate": "2022",
        "areaServed": [
          { "@type": "City", "name": "Burnaby" },
          { "@type": "City", "name": "Vancouver" },
          { "@type": "City", "name": "Coquitlam" },
          { "@type": "City", "name": "Surrey" }
        ],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "10843 132a St",
          "addressLocality": "Surrey",
          "addressRegion": "BC",
          "postalCode": "V3T 3Y2",
          "addressCountry": "CA"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 49.199814, "longitude": -122.855305 },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
            ],
            "opens": "08:30",
            "closes": "21:00"
          }
        ],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5.0",
          "reviewCount": "153",
          "bestRating": "5"
        },
        "sameAs": [
          "https://www.instagram.com/freeflydriving/",
          "https://www.facebook.com/freeflydriving/",
          "https://www.youtube.com/channel/UCn79zN7UAQA_hMes59SRKfA",
          "https://www.tiktok.com/@freeflydriving"
        ]
      }
    </script>

    <link rel="preconnect" href="https://www.wixapis.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
